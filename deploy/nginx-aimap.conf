# /etc/nginx/sites-available/aimap
# Obtain the certificate first:  sudo certbot --nginx -d survey.example.et

server {
    listen 80;
    server_name survey.example.et;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name survey.example.et;

    ssl_certificate     /etc/letsencrypt/live/survey.example.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/survey.example.et/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/html;

    # Respondents on 2G submit slowly; do not cut them off mid-questionnaire.
    client_body_timeout 120s;
    client_max_body_size 1m;

    # Admin endpoints: restrict at the edge as well as by token.
    location /admin/ {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    # The dashboard page and its assets. The server gates these behind a session
    # of its own -- an unauthenticated request gets a sign-in page, not the
    # dashboard -- but restricting them at the edge as well means a scanner does
    # not even learn that an admin surface exists here.
    location ~ ^/dashboard(\.html|\.js|\.css|-login\.css)?$ {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
